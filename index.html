<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5257">
<title>Kharcha Pani</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2a2b;--muted:#6b7577;--line:#e6e1d6;--brand:#0f5257;--brand2:#13706f;--ok:#1f8a4c;--warn:#c77a06;--bad:#c2372f;--chip:#efeae0;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 14px 10px;padding-top:calc(12px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;font-size:19px;letter-spacing:.2px}
.logo small{display:block;font-weight:500;font-size:11.5px;opacity:.75;letter-spacing:.3px}
.mon{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.12);border-radius:999px;padding:2px}
.mon button{background:none;border:0;color:#fff;font-size:20px;width:36px;height:34px;border-radius:999px}
.mon span{min-width:92px;text-align:center;font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.5);text-underline-offset:4px}
main{padding:12px 12px 96px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.hero{background:linear-gradient(160deg,#0f5257,#13706f);color:#fff}
.hero .lbl{opacity:.8;font-size:12.5px}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.big small{font-size:15px;font-weight:600;opacity:.8;margin-right:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid3 div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px}
.grid3 b{display:block;font-size:16px}
.grid3 span{font-size:11.5px;opacity:.85}
.bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:8px}
.hero .bar{background:rgba(255,255,255,.2)}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.daily{display:flex;justify-content:space-between;align-items:center;gap:10px}
.daily .v{font-size:26px;font-weight:800}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.ok{background:#e3f3e9;color:var(--ok)}.pill.warn{background:#fdf0db;color:var(--warn)}.pill.bad{background:#fbe4e2;color:var(--bad)}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.head{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;border-left:5px solid #ccc}
.head .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.head .n{font-weight:700}
.head .s{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.subs span{font-size:11.5px;background:var(--chip);border-radius:8px;padding:2px 7px;color:var(--muted)}
.alert{border-radius:14px;padding:11px 14px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:center}
.alert.warn{background:#fdf0db;color:#7a4a00}.alert.bad{background:#fbe4e2;color:#7d1f19}.alert.info{background:#e1eeee;color:#0f4447}
.alert button{margin-left:auto;flex:none}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--brand);color:#fff}
.btn.sec2{background:var(--chip);color:var(--ink)}
.btn.danger{background:#fbe4e2;color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ent{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ent .top{display:flex;justify-content:space-between;gap:10px}
.ent .d{font-weight:650;word-break:break-word}
.ent .a{font-weight:800;white-space:nowrap}
.ent .m{font-size:12px;color:var(--muted);margin-top:2px}
.ent .x{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-all;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600}
.chip.sug{border-color:var(--brand);background:#e1eeee;color:var(--brand)}
.chip.on{background:var(--brand);color:#fff}
.chip.ign{background:#fff;border-color:var(--line);color:var(--muted)}
.chip.subc{font-size:12px;padding:5px 9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tag{font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px;color:#fff;white-space:nowrap}
.dateh{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 4px 6px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;white-space:nowrap;font-weight:650;color:var(--muted);position:relative}
nav button .ic{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--brand)}
nav .badge{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:800}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:var(--warn);color:#fff;font-size:30px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheetbg.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:2px 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:var(--chip);border-radius:999px;width:32px;height:32px;font-size:16px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 2px 4px}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:0}
.inp:focus{border-color:var(--brand2)}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.list button,.list .li{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:13px 14px;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.list .ic{font-size:20px;width:26px;text-align:center}
.list .tx b{display:block;font-weight:650}
.list .tx span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2a2b;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
.bud{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-bottom:8px}
.bud .inp{padding:9px 10px;text-align:right}
.muted{color:var(--muted)}.small{font-size:12.5px}
.sum{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px dashed var(--line)}
.sum:last-child{border:0}
.srch{display:flex;gap:8px;margin-bottom:10px}
.srch .inp{padding:9px 12px}
.srch select.inp{max-width:42%}
.saved{font-size:11px;opacity:.75}
.tap{cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:inherit;padding:0;width:100%}
.tap.big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1;display:block;margin-top:2px}
.tap.big::after{content:' ›';font-size:22px;opacity:.6}
.grid3 button.tap{background:rgba(255,255,255,.12);border-radius:12px;padding:8px;text-align:left}
.grid3 button.tap span::after{content:' ›';opacity:.7}
.cmp td[data-ck]{cursor:pointer}
.fbar{display:flex;align-items:center;gap:8px;background:#e1eeee;color:var(--brand);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:700;font-size:13.5px}
.fbar button{margin-left:auto;border:0;background:#fff;border-radius:999px;padding:4px 10px;font-weight:700;color:var(--brand)}
.tblw{background:var(--card);border-radius:14px;overflow-x:auto;margin-bottom:12px}
table.cmp{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:8px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line);white-space:normal;min-width:92px}
.cmp thead th{font-size:11.5px;color:var(--muted);font-weight:700;background:#faf8f3}
.cmp thead tr:first-child th{color:var(--ink);font-size:12.5px;text-align:center;border-bottom:0}
.tblw{max-height:calc(100vh - 250px);max-height:calc(100dvh - 250px);overflow:auto;-webkit-overflow-scrolling:touch}
.cmp thead th{position:sticky;z-index:2}
.cmp thead tr:first-child th{top:0;height:34px}
.cmp thead tr:nth-child(2) th{top:34px;box-shadow:0 1px 0 var(--line)}
.cmp thead th:first-child{left:0;z-index:3;background:#faf8f3}
.cmp .mb{border-left:2px solid var(--line)}
.cmp tr.sub td{font-size:12px;color:var(--muted);padding-top:5px;padding-bottom:5px}
.cmp tr.sub td:first-child{padding-left:20px}
.cmp tr.tot td{font-weight:800;background:#f3f7f6;border-bottom:0}
.cmp tr.tot td:first-child{background:#f3f7f6}
.cmp td.over{color:var(--bad);font-weight:700}
.cmp td.under{color:var(--ok)}
.cmp tr[data-cm]{cursor:pointer}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">Kharcha Pani<small id="savedInfo" data-act="syncnow">Saved on this phone</small></div>
    <div class="mon"><button id="mPrev" aria-label="Previous month">‹</button><span id="mLabel"></span><button id="mNext" aria-label="Next month">›</button></div>
  </div>
</header>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-review"></section>
  <section class="view" id="v-compare"></section>
  <section class="view" id="v-flow"></section>
  <section class="view" id="v-entries"></section>
  <section class="view" id="v-more"></section>
</main>

<button class="fab" id="fab" aria-label="Add expense">+</button>

<nav>
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="review"><span class="ic">🏷️</span>To tag<span class="badge" id="badge" style="display:none"></span></button>
  <button data-v="compare"><span class="ic">📊</span>Compare</button>
  <button data-v="flow"><span class="ic">💱</span>In &amp; Out</button>
  <button data-v="entries"><span class="ic">📋</span>Entries</button>
  <button data-v="more"><span class="ic">⚙️</span>More</button>
</nav>

<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileStmt" accept=".xls,.xlsx,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" multiple hidden>
<input type="file" id="fileSync" hidden>

<script>/* Kharcha Pani - offline spreadsheet reader (.xls BIFF8, .xlsx, .csv). No libraries. */
(function (G) {
  'use strict';
  var FREE = 0xFFFFFFFA;

  /* ---------- Compound File (OLE) reader for .xls ---------- */
  function readCFB(u8) {
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    var ss = 1 << dv.getUint16(0x1E, true), mss = 1 << dv.getUint16(0x20, true);
    var nfat = dv.getUint32(0x2C, true), dirStart = dv.getUint32(0x30, true);
    var cutoff = dv.getUint32(0x38, true), mfStart = dv.getUint32(0x3C, true), nmf = dv.getUint32(0x40, true);
    var dfStart = dv.getUint32(0x44, true), ndf = dv.getUint32(0x48, true);
    var difat = [], i;
    for (i = 0; i < 109; i++) difat.push(dv.getUint32(0x4C + i * 4, true));
    var s = dfStart, per = ss / 4;
    while (s < FREE && ndf-- > 0) {
      var off = (s + 1) * ss;
      for (i = 0; i < per - 1; i++) difat.push(dv.getUint32(off + i * 4, true));
      s = dv.getUint32(off + (per - 1) * 4, true);
    }
    var fat = [];
    for (var f = 0; f < nfat; f++) {
      var o = (difat[f] + 1) * ss;
      for (i = 0; i < per; i++) fat.push(dv.getUint32(o + i * 4, true));
    }
    function readChain(st) {
      var parts = [], guard = 0;
      while (st < FREE && guard++ < 1e6) { parts.push(u8.subarray((st + 1) * ss, (st + 2) * ss)); st = fat[st]; }
      return concat(parts);
    }
    var dir = readChain(dirStart), ents = [];
    var ddv = new DataView(dir.buffer, dir.byteOffset, dir.byteLength);
    for (var p = 0; p + 128 <= dir.length; p += 128) {
      var nl = ddv.getUint16(p + 0x40, true), name = '';
      for (i = 0; i < Math.max(0, nl - 2); i += 2) name += String.fromCharCode(ddv.getUint16(p + i, true));
      ents.push({ name: name, type: dir[p + 0x42], start: ddv.getUint32(p + 0x74, true), size: ddv.getUint32(p + 0x78, true) });
    }
    var mini = null, minifat = null;
    function get(name) {
      var e = null;
      for (var k = 0; k < ents.length; k++) if (ents[k].type === 2 && ents[k].name.toLowerCase() === name.toLowerCase()) e = ents[k];
      if (!e) return null;
      if (e.size >= cutoff) return readChain(e.start).subarray(0, e.size);
      if (!mini) {
        mini = readChain(ents[0].start);
        var mf = nmf ? readChain(mfStart) : new Uint8Array(0), mdv = new DataView(mf.buffer, mf.byteOffset, mf.byteLength);
        minifat = []; for (var q = 0; q + 4 <= mf.length; q += 4) minifat.push(mdv.getUint32(q, true));
      }
      var parts = [], x = e.start;
      while (x < FREE) { parts.push(mini.subarray(x * mss, (x + 1) * mss)); x = minifat[x]; }
      return concat(parts).subarray(0, e.size);
    }
    return { get: get, names: ents.map(function (e) { return e.name; }) };
  }
  function concat(parts) {
    var n = 0, i; for (i = 0; i < parts.length; i++) n += parts[i].length;
    var out = new Uint8Array(n), o = 0;
    for (i = 0; i < parts.length; i++) { out.set(parts[i], o); o += parts[i].length; }
    return out;
  }

  /* ---------- BIFF8 workbook -> rows of first worksheet ---------- */
  function readBIFF(wb) {
    var dv = new DataView(wb.buffer, wb.byteOffset, wb.byteLength);
    var recs = [], p = 0;
    while (p + 4 <= wb.length) {
      var t = dv.getUint16(p, true), l = dv.getUint16(p + 2, true);
      recs.push({ t: t, d: wb.subarray(p + 4, p + 4 + l) }); p += 4 + l;
    }
    var sst = [], sheets = [], i;
    for (i = 0; i < recs.length; i++) {
      if (recs[i].t === 0x00FC) {
        var chunks = [recs[i].d];
        while (i + 1 < recs.length && recs[i + 1].t === 0x003C) chunks.push(recs[++i].d);
        sst = parseSST(chunks);
      }
    }
    // Locate worksheets: BOF records with type 0x0010
    var cur = null, sheetIdx = -1, pendingFormula = null;
    for (i = 0; i < recs.length; i++) {
      var r = recs[i], d = r.d, rdv = new DataView(d.buffer, d.byteOffset, d.byteLength);
      if (r.t === 0x0809) {
        var bt = rdv.getUint16(2, true);
        if (bt === 0x0010) { sheetIdx++; cur = []; sheets.push(cur); } else cur = null;
        continue;
      }
      if (!cur) continue;
      if (r.t === 0x000A) { cur = null; continue; }
      var row, col;
      if (r.t === 0x00FD) { row = rdv.getUint16(0, true); col = rdv.getUint16(2, true); put(cur, row, col, sst[rdv.getUint32(6, true)]); }
      else if (r.t === 0x0203) { row = rdv.getUint16(0, true); col = rdv.getUint16(2, true); put(cur, row, col, rdv.getFloat64(6, true)); }
      else if (r.t === 0x027E) { row = rdv.getUint16(0, true); col = rdv.getUint16(2, true); put(cur, row, col, rk(rdv.getUint32(6, true))); }
      else if (r.t === 0x00BD) {
        row = rdv.getUint16(0, true); col = rdv.getUint16(2, true);
        var n = (d.length - 6) / 6;
        for (var k = 0; k < n; k++) put(cur, row, col + k, rk(rdv.getUint32(4 + k * 6 + 2, true)));
      }
      else if (r.t === 0x0204) { row = rdv.getUint16(0, true); col = rdv.getUint16(2, true); put(cur, row, col, readStr(d, 6, true).s); }
      else if (r.t === 0x0006) {
        row = rdv.getUint16(0, true); col = rdv.getUint16(2, true);
        if (rdv.getUint16(12, true) === 0xFFFF) { if (d[6] === 0) pendingFormula = [row, col]; }
        else put(cur, row, col, rdv.getFloat64(6, true));
      }
      else if (r.t === 0x0207 && pendingFormula) { put(cur, pendingFormula[0], pendingFormula[1], readStr(d, 0, true).s); pendingFormula = null; }
    }
    return sheets.map(function (s) { return dense(s); });
  }
  function put(arr, r, c, v) { (arr[r] = arr[r] || [])[c] = v; }
  function dense(s) {
    var out = [];
    for (var r = 0; r < s.length; r++) {
      var row = s[r] || [], o = [];
      for (var c = 0; c < row.length; c++) o.push(row[c] === undefined ? '' : row[c]);
      out.push(o);
    }
    return out;
  }
  function rk(v) {
    var n;
    if (v & 2) n = v >> 2;
    else { var b = new DataView(new ArrayBuffer(8)); b.setUint32(4, v & 0xFFFFFFFC, true); b.setUint32(0, 0, true); n = b.getFloat64(0, true); }
    return (v & 1) ? n / 100 : n;
  }
  function readStr(d, off, wide) { // XLUnicodeString (single record)
    var cch = wide ? (d[off] | (d[off + 1] << 8)) : d[off]; off += wide ? 2 : 1;
    var fl = d[off++], s = '';
    if (fl & 8) off += 2; if (fl & 4) off += 4;
    for (var i = 0; i < cch; i++) {
      if (fl & 1) { s += String.fromCharCode(d[off] | (d[off + 1] << 8)); off += 2; } else s += String.fromCharCode(d[off++]);
    }
    return { s: s, off: off };
  }
  function parseSST(chunks) {
    var ci = 0, pos = 8, d = chunks[0], out = [];
    var dv0 = new DataView(d.buffer, d.byteOffset, d.byteLength), uniq = dv0.getUint32(4, true);
    function need() { while (pos >= d.length && ci + 1 < chunks.length) { d = chunks[++ci]; pos = 0; } }
    function u8() { need(); return d[pos++]; }
    function u16() { return u8() | (u8() << 8); }
    function u32() { return (u16() | (u16() << 16)) >>> 0; }
    function skip(n) { while (n > 0) { need(); var k = Math.min(n, d.length - pos); pos += k; n -= k; if (ci + 1 >= chunks.length && pos >= d.length) break; } }
    for (var u = 0; u < uniq; u++) {
      if (ci >= chunks.length - 1 && pos >= d.length) break;
      var cch = u16(), fl = u8(), runs = 0, ext = 0, s = '';
      if (fl & 8) runs = u16(); if (fl & 4) ext = u32();
      var hi = fl & 1;

function analyse(rows,fname){
  var hi=-1,i,j;
  for(i=0;i<Math.min(rows.length,40);i++){
    var cells=(rows[i]||[]).map(function(c){return String(c).toLowerCase().trim()});
    if(cells.some(function(c){return /date/.test(c)}) && cells.some(function(c){return /amount|debit|withdraw/.test(c)})){hi=i;break}
  }
  if(hi<0) throw new Error('Could not find the header row (Date / Amount) in '+fname);
  var H=rows[hi].map(function(c){return String(c).toLowerCase().trim()});
  function find(re,not){for(var k=0;k<H.length;k++) if(re.test(H[k])&&!(not&&not.test(H[k]))) return k; return -1}
  var col={
    date:find(/^(transaction |txn |posting )?date/,/value/), det:find(/detail|narration|merchant|particular|payee/),
    desc:find(/description/), amt:find(/amount/,/balance/), type:find(/debit\/credit|dr\/cr|cr\/dr|^type$|txn type|transaction type/),
    dr:find(/^debit( amount)?$|withdraw|money out|^dr$/), cr:find(/^credit( amount)?$|deposit|money in|^cr$/),
    cur:find(/currency|ccy/), st:find(/status/), rem:find(/remark|note/), bal:find(/balance/)
  };
  if(col.date<0) col.date=find(/date/);
  if(col.det<0){col.det=col.desc; col.desc=-1}
  // detect source
  var src='', pre=rows.slice(0,hi).map(function(r){return (r||[]).join(' ')}).join(' ')+' ';
  var m=/card\s*(?:no|number)?[^\d]*([\d\*xX ]{8,})/i.exec(pre), m2=/account\s*(?:no|number)?[^\dxX]*([\dxX\*]{4,})/i.exec(pre);
  if(m){var dg=m[1].replace(/\D/g,''); src='card'+dg.slice(-4)}
  else if(m2){var dg2=m2[1].replace(/\D/g,''); src='acc'+dg2.slice(-2)}
  else src='file:'+fname.replace(/\.[a-z]+$/i,'').slice(0,20);
  var isCard=/^card/.test(src);
  var out=[];
  for(i=hi+1;i<rows.length;i++){
    var r=rows[i]||[]; var d=parseDate(r[col.date]); if(!d) continue;
    var t=String(col.det>=0?r[col.det]:'').trim(), x=String(col.desc>=0?r[col.desc]:'').trim();
    var amt=null, isDebit=null;
    if(col.dr>=0||col.cr>=0){
      var dv=col.dr>=0?num(r[col.dr]):null, cv=col.cr>=0?num(r[col.cr]):null;
      if(dv) {amt=Math.abs(dv); isDebit=true} else if(cv){amt=Math.abs(cv); isDebit=false}
    }
    if(amt==null && col.amt>=0){ var av=num(r[col.amt]); if(av==null) continue; amt=Math.abs(av);
      if(col.type>=0){ var ty=String(r[col.type]).toLowerCase(); isDebit=!/^cr|credit/.test(ty) }
      else isDebit = isCard ? av>0 : av<0;
    }
    if(amt==null||amt===0) continue;
    var cur=col.cur>=0?String(r[col.cur]).trim().toUpperCase()||'AED':'AED';
    var st=col.st>=0?String(r[col.st]).trim():'';
    var rem=col.rem>=0?String(r[col.rem]).trim():'';
    var bal=col.bal>=0?num(r[col.bal]):null;
    out.push({d:d,t:t,x:x,a:Math.round(amt*100)/100,c:cur,debit:isDebit,st:st,rem:rem,bal:bal});
  }
  return {src:src,rows:out,count:out.length};
}
function isCardPayment(e){return /cc no\.?\s*-|card payment|credit card payment|card repayment|payment received|cc payment/i.test(e.t+' '+e.x)}

function importParsed(list,fromDate){
  learn();
  var byK={}; S.entries.forEach(function(e){if(e.k) byK[e.k]=e});
  var dead={}; S.deleted.forEach(function(k){dead[k]=1});
  S.balances=S.balances||{};
  var res={added:0,auto:0,need:0,needIn:0,autoIn:0,dup:0,credit:0,ccpay:0,status:0,older:0,matched:0,files:[]};
  list.forEach(function(p){
    var occ={}, added=0, chain=[];
    p.rows.forEach(function(r){
      if(BAD_STATUS.test(r.st)){res.status++;return}
      chain.push(r);
      var inn=!r.debit, cc=isCardPayment(r);
      var base=(inn?'in|':(cc?'cc|':''))+dkey(p.src,r.d,r.a,r.c,r.t); occ[base]=(occ[base]||0)+1; var k=base+'#'+occ[base];
      if(r.d<fromDate){res.older++;return}
      if(byK[k]||dead[k]){res.dup++; r._e=byK[k]; return}
      if(!inn&&!cc){
        // match a manual entry made for the same card/amount within 3 days
        var mm=null;
        S.entries.forEach(function(e){ if(!mm&&!e.k&&!isIn(e)&&e.s===p.src&&Math.abs(e.a-r.a)<0.01&&e.c===r.c&&Math.abs(new Date(e.d)-new Date(r.d))<=3*864e5) mm=e });
        if(mm){mm.k=k; mm.x=mm.x||r.x; mm.up=now(); byK[k]=mm; r._e=mm; res.matched++; return}
      }
      var e={id:uid(),d:r.d,t:r.t||r.x,x:r.t?r.x:'',a:r.a,c:r.c,s:p.src,h:'',u:'',how:'',k:k,r:r.rem,up:now()};
      if(inn){ e.io='in'; var pay=payerOf(r.t,r.x); if(pay) e.t=pay; e.r=e.r||refOf(r.x); }
      if(cc){ e.h='ccpay'; e.how='auto'; res.ccpay++; }
      else {
        var sg=suggest(e);
        if(sg&&sg.auto){e.h=sg.h;e.u=sg.u;e.how='auto'; if(inn) res.autoIn++; else res.auto++}
        else if(inn) res.needIn++; else res.need++;
        if(inn) res.credit++;
      }
      S.entries.push(e); byK[k]=e; r._e=e; res.added++; added++;
    });
    // bank balances (for the In & Out check) and the real AED taken for INR transfers
    if(/^acc/.test(p.src)){
      var wb=chain.filter(function(r){return r.bal!=null});
      if(wb.length){
        var newestFirst=wb[0].d>=wb[wb.length-1].d, ord=newestFirst?wb:wb.slice().reverse();
        var B=S.balances[p.src]||(S.balances[p.src]={}), seen={};
        ord.forEach(function(r){ if(!seen[r.d]){seen[r.d]=1; B[r.d]=r.bal} });
        ord.forEach(function(r,i){ var o=ord[i+1]; if(r.c==='INR'&&o&&r._e){ var dl=Math.round((r.debit?o.bal-r.bal:r.bal-o.bal)*100)/100, est=r.a/(S.settings.inr||26); if(dl>0&&Math.abs(dl-est)<est*0.15) r._e.fx=dl } });
      }
    }
    res.files.push({src:p.src,count:p.count,added:added});
  });
  save(); learn();
  return res;
}

function monthEntries(m){return S.entries.filter(function(e){return e.d.slice(0,7)===m})}
function calc(m){
  var ents=monthEntries(m), per={}, untag=0, untagN=0;
  S.heads.forEach(function(h){per[h.id]={spent:0,budget:budgetOf(m,h.id),subs:{}}});
  ents.forEach(function(e){
    if(e.h==='ignore'||e.h==='ccpay'||e.h==='repay') return;
    var v=aed(e);
    if(isIn(e)){ // money back for a head (office reimbursement, loan repaid ...) reduces that head
      var rr=S.settings.inr||26, back=function(h,u,val){ if(per[h]){ per[h].spent-=val; if(u) per[h].subs[u]=(per[h].subs[u]||0)-val } };
      if(e.parts&&e.parts.length) e.parts.forEach(function(p){back(p.h,p.u,e.c==='INR'?p.a/rr:p.a)}); else back(e.h,e.u,v);
      return;
    }
    if(e.parts&&e.parts.length){
      var r=S.settings.inr||26, used=0;
      e.parts.forEach(function(p){var pv=e.c==='INR'?p.a/r:p.a; used+=pv; if(per[p.h]){per[p.h].spent+=pv; if(p.u) per[p.h].subs[p.u]=(per[p.h].subs[p.u]||0)+pv} else {untag+=pv}});
      if(v-used>0.005){untag+=v-used;untagN++}
      return;
    }
    if(!e.h||!per[e.h]){untag+=v;untagN++;return}
    per[e.h].spent+=v; if(e.u) per[e.h].subs[e.u]=(per[e.h].subs[e.u]||0)+v;
  });
  var tb=0,ts=untag,db=0,ds=0;
  S.heads.forEach(function(h){var p=per[h.id]; tb+=p.budget; ts+=p.spent; if(h.daily){db+=p.budget;ds+=p.spent}});
  var dim=daysIn(m), t=today(), tm=monthOf(t), dl, dayNo;
  if(m===tm){dayNo=+t.slice(8);dl=dim-dayNo+1} else if(m<tm){dayNo=dim;dl=0} else {dayNo=0;dl=dim}
  return {per:per,untag:untag,untagN:untagN,tb:tb,ts:ts,db:db,ds:ds,dim:dim,dl:dl,dayNo:dayNo,isCur:m===tm,isPast:m<tm};
}
function calcP(ms){
  ms=ms||selMonths; if(ms.length===1) return calc(ms[0]);
  var R={per:{},untag:0,untagN:0,tb:0,ts:0,db:0,ds:0}, tm=monthOf(today());
  S.heads.forEach(function(h){R.per[h.id]={spent:0,budget:0,subs:{}}});
  ms.forEach(function(m){ var c=calc(m);
    S.heads.forEach(function(h){ var a=R.per[h.id], b=c.per[h.id]; a.spent+=b.spent; a.budget+=b.budget; for(var s in b.subs) a.subs[s]=(a.subs[s]||0)+b.subs[s] });
    ['untag','untagN','tb','ts','db','ds'].forEach(function(k){R[k]+=c[k]}) });
  var last=ms[ms.length-1]; R.isCur=last===tm; R.isPast=last<tm; R.dl=0; R.multi=ms.length;
  return R;
}

  var all=S.entries.filter(function(e){return !e.h}).sort(function(a,b){return b.d<a.d?-1:b.d>a.d?1:0});
  var list=all.filter(function(e){return !isIn(e)}), inl=all.filter(isIn);
  var h='';
  if(!all.length){el.innerHTML='<div class="empty"><b>All tagged 🎉</b>Every entry has a head. Import a new statement when ready.</div><button class="btn full" data-act="import">⬆️ Import statement</button>';return}
  var sugN=list.filter(function(e){return !(e.parts&&e.parts.length)&&suggest(e)}).length;
  h+='<div class="card"><b>'+all.length+'</b> '+(all.length===1?'entry needs':'entries need')+' a head. Tap the right head under each one. '+
     '<span class="muted small">Highlighted = my guess. Once you tag a shop, I remember it next time.</span>'+
     (sugN?'<button class="btn full" style="margin-top:10px" data-act="acceptall">✓ Accept all '+sugN+' guesses</button>':'')+'</div>';
  var lastD='';
  list.slice(0,REVIEW_LIMIT).forEach(function(e){
    if(e.d!==lastD){h+='<div class="dateh">'+dLabel(e.d)+'</div>';lastD=e.d}
    h+=reviewCard(e);
  });
  if(list.length>REVIEW_LIMIT) h+='<div class="empty small">Showing '+REVIEW_LIMIT+' of '+list.length+'. Tag these and more will appear.</div>';
  if(inl.length){
    h+='<div class="sec" style="color:var(--ok)">💰 Money received · '+inl.length+'</div><div class="small muted" style="margin:0 4px 8px">Salary, money back for a head (office, loan…), or other income. Refunds and your own money are not counted.</div>';
    lastD='';
    inl.slice(0,REVIEW_LIMIT).forEach(function(e){ if(e.d!==lastD){h+='<div class="dateh">'+dLabel(e.d)+'</div>';lastD=e.d} h+=reviewCardIn(e) });
  }
  el.innerHTML=h;
}
function amtHTML(e){return e.c==='INR'?'<span>INR '+fmt(e.a,2)+'</span><div class="m" style="text-align:right">≈ '+money(aed(e),2)+'</div>':money(e.a,2)}

  h+='</div><div class="chips">'+IN_TAGS.slice(3).map(function(q){return '<button class="chip ign'+(sg&&sg.h===q[0]?' sug':'')+'" data-tag="'+q[0]+'">🚫 '+q[1]+'</button>'}).join('')+'</div>';

  h+='<button class="btn sec2 sm" style="margin-top:10px" data-split="'+e.id+'">➗ Split (e.g. salary + office money)</button></div>';

function tagEntry(e,hid,u){
  var hh=head(hid);
  if(u==null){ var sg=suggest(e); u=(sg&&sg.h===hid&&sg.u)?sg.u:(hh&&hh.subs?guessSub(e,hh):'') }
  delete e.parts; e.h=hid;e.u=u||'';e.how='user';e.up=now();
  learn();
  // apply to other untagged entries from the same shop if the learning is clear
  var k=mkey(e.t), more=0, L=LEARN[(isIn(e)?'in:':'')+k];
  if(k&&L&&hid!=='ignore'&&hid!=='salary'){
    var top=0; for(var c in L.c) top=Math.max(top,L.c[c]);
    if(top/L.n>=0.8&&L.n>=2) S.entries.forEach(function(o){ if(!o.h&&o!==e&&!!isIn(o)===!!isIn(e)&&mkey(o.t)===k&&o.c===e.c){o.h=hid;o.u=e.u;o.how='auto';o.up=now();more++} });
  }
  save(); return more;
}
function guessSub(e,hh){var txt=e.t+' '+e.x;for(var i=0;i<KW.length;i++) if(KW[i][1]===hh.id&&KW[i][0].test(txt)) return KW[i][2]; return hh.subs?hh.subs[hh.subs.length-1][0]:''}

var cmpOpt={n:2,diff:false};

  var el=$('#v-compare'), months=[];

    '<div class="seg"><button data-cmpd="0"'+(!cmpOpt.diff?' class="on"':'')+'>Budget · Actual</button><button data-cmpd="1"'+(cmpOpt.diff?' class="on"':'')+'>Budget · Actual · Difference</button></div>';
  var span=cmpOpt.diff?3:2;
  h+='<div class="tblw"><table class="cmp"><thead><tr><th></th>'+months.map(function(m){return '<th class="mb" colspan="'+span+'">'+mLabel(m)+(m===monthOf(today())?' ●':'')+'</th>'}).join('')+'</tr>'+
     '<tr><th>Head</th>'+months.map(function(){return '<th class="mb">Budget</th><th>Actual</th>'+(cmpOpt.diff?'<th>Diff</th>':'')}).join('')+'</tr></thead><tbody>';
  function cells(b,a,hid,m){
    var over=b>0?a>b+0.005:a>0;
    return '<td class="mb" data-ck="b" data-cmm="'+m+'">'+(b?fmt(b):'–')+'</td><td class="'+(over?'over':'')+'" data-ck="a" data-cmm="'+m+'" data-cmh="'+hid+'">'+(a?fmt(a):'–')+'</td>'+
      (cmpOpt.diff?'<td class="'+(b-a<-0.005?'over':b-a>0.005?'under':'')+'">'+((b||a)?fmt(b-a):'–')+'</td>':'');
  }
  S.heads.forEach(function(x){
    var any=C.some(function(c){var p=c.per[x.id];return p.budget>0||p.spent>0}); if(!any) return;
    h+='<tr data-cm="'+x.id+'"><td><span class="dot" style="background:'+x.c+'"></span>'+esc(x.n)+'</td>'+C.map(function(c,i){var p=c.per[x.id];return cells(p.budget,p.spent,x.id,months[i])}).join('')+'</tr>';
    if(x.subs) x.subs.forEach(function(sb){
      if(!C.some(function(c){return c.per[x.id].subs[sb[0]]})) return;
      h+='<tr class="sub"><td>'+esc(sb[1])+'</td>'+C.map(function(c,i){var v=c.per[x.id].subs[sb[0]]||0;return '<td class="mb"></td><td data-ck="a" data-cmm="'+months[i]+'" data-cmh="'+x.id+'" data-cms="'+sb[0]+'">'+(v?fmt(v):'–')+'</td>'+(cmpOpt.diff?'<td></td>':'')}).join('')+'</tr>';
    });
  });
  if(C.some(function(c){return c.untagN})) h+='<tr data-cm="_none"><td><span class="dot" style="background:#bbb"></span>Not tagged yet</td>'+C.map(function(c,i){return cells(0,c.untag,'_none',months[i])}).join('')+'</tr>';
  h+='<tr class="tot"><td>Total</td>'+C.map(function(c,i){return cells(c.tb,c.ts,'',months[i])}).join('')+'</tr></tbody></table></div>';
  if(isMulti()){ var PT=calcP(); h+='<div class="card" style="display:flex;justify-content:space-between"><span>All '+months.length+' months together</span><b>Budget '+fmt(PT.tb)+' · Actual <span style="color:'+(PT.ts>PT.tb?'var(--bad)':'var(--ok)')+'">'+fmt(PT.ts)+'</span></b></div>' }
  // short summary per month
  h+='<div class="card">'+C.slice().reverse().map(function(c,i){var m=months[months.length-1-i],d=c.tb-c.ts;
    return '<div class="sum"><span>'+mLabel(m)+(c.isCur?' (so far)':'')+'</span><b style="color:'+(d<0?'var(--bad)':'var(--ok)')+'">'+(d<0?'Over by '+money(-d):'Under by '+money(d))+'</b></div>'}).join('')+'</div>'+

document.addEventListener('click',function(ev){
  var cell=ev.target.closest('td[data-ck]');
  if(cell){ setMonth(cell.dataset.cmm);
    if(cell.dataset.ck==='b'){ render(); openBreakdown('budget'); }
    else { entFilter={h:cell.dataset.cmh||'',q:'',u:cell.dataset.cms||'',daily:false}; setView('entries'); }
    return; }
  var b=ev.target.closest('[data-cmpn],[data-cmpd],tr[data-cm]'); if(!b) return;
  if(b.dataset.cmpn){cmpOpt.n=+b.dataset.cmpn;renderCompare()}
  else if(b.dataset.cmpd){cmpOpt.diff=b.dataset.cmpd==='1';renderCompare()}
  else if(b.dataset.cm){entFilter={h:b.dataset.cm,q:'',u:'',daily:false};setView('entries')}
});

/* ---------- IN & OUT (money received, where it went, bank check) ---------- */
function partsOf(e){ var r=S.settings.inr||26; if(e.parts&&e.parts.length) return e.parts.map(function(p){return {h:p.h,u:p.u,v:e.c==='INR'?p.a/r:p.a}}).concat(partsLeft(e)>0.005?[{h:'',u:'',v:aed(e)*(partsLeft(e)/e.a)}]:[]); return [{h:e.h,u:e.u,v:aed(e)}] }
function realAED(e){ return e.c==='INR'?(e.fx||e.a/(S.settings.inr||26)):e.a }
function flowCalc(m){
  var F={salary:0,income:0,borrow:0,repay:0,back:{},backT:0,untagIn:0,untagInN:0,refund:0,own:0,gross:{},grossT:0,untagOut:0,ignored:0};
  monthEntries(m).forEach(function(e){
    if(e.h==='ccpay') return;
    partsOf(e).forEach(function(p){
      if(isIn(e)){
        if(p.h==='salary') F.salary+=p.v; else if(p.h==='income') F.income+=p.v; else if(p.h==='borrow') F.borrow+=p.v; else if(p.h==='refund') F.refund+=p.v; else if(p.h==='own') F.own+=p.v;
        else if(head(p.h)){F.back[p.h]=(F.back[p.h]||0)+p.v;F.backT+=p.v} else {F.untagIn+=p.v;F.untagInN++}
      } else {
        if(p.h==='ignore') F.ignored+=p.v; else if(p.h==='repay') F.repay+=p.v; else if(head(p.h)){F.gross[p.h]=(F.gross[p.h]||0)+p.v;F.grossT+=p.v} else {F.untagOut+=p.v}
      }
    });
  });
  F.inT=F.salary+F.income+F.backT+F.untagIn; F.outT=F.grossT+F.untagOut; F.saved=F.inT-F.outT;
  return F;
}
function flowCalcP(ms){
  if(ms.length===1) return flowCalc(ms[0]);
  var T={salary:0,income:0,borrow:0,repay:0,back:{},backT:0,untagIn:0,untagInN:0,refund:0,own:0,gross:{},grossT:0,untagOut:0,ignored:0,inT:0,outT:0,saved:0};
  ms.forEach(function(m){ var F=flowCalc(m); for(var k in T){ if(typeof T[k]==='number') T[k]+=F[k]; else for(var h in F[k]) T[k][h]=(T[k][h]||0)+F[k][h] } });
  return T;
}
function bankCheckP(ms,src){
  if(ms.length===1) return bankCheck(ms[0],src);
  var A=bankCheck(ms[0],src), Z=bankCheck(ms[ms.length-1],src), R={src:src,opening:A.opening,closing:Z.closing,lastD:Z.lastD,in:0,outExp:0,outCC:0,fxDiff:0};
  ms.forEach(function(m){ var x=bankCheck(m,src); R.in+=x.in; R.outExp+=x.outExp; R.outCC+=x.outCC; R.fxDiff+=x.fxDiff });
  if(R.opening!=null){ R.expected=R.opening+R.in-R.outExp-R.outCC; if(R.closing==null) R.closing=R.opening; R.diff=R.closing-R.expected }
  return R;
}
function bankCheck(m,src){
  var B=(S.balances||{})[src]||{}, ds=Object.keys(B).sort(), start=m+'-01', end=m+'-'+pad(daysIn(m));
  var before=ds.filter(function(d){return d<start}), inM=ds.filter(function(d){return d>=start&&d<=end});
  var R={src:src,opening:before.length?B[before[before.length-1]]:null,closing:inM.length?B[inM[inM.length-1]]:null,lastD:inM.length?inM[inM.length-1]:null,in:0,outExp:0,outCC:0,fxDiff:0};
  S.entries.forEach(function(e){ if(e.s!==src||!e.k||(e.sd||e.d).slice(0,7)!==m) return; var v=realAED(e);
    if(e.c==='INR'&&e.fx) R.fxDiff+=e.fx-e.a/(S.settings.inr||26);
    if(isIn(e)) R.in+=v; else if(e.h==='ccpay') R.outCC+=v; else R.outExp+=v; });
  if(R.opening!=null){ R.expected=R.opening+R.in-R.outExp-R.outCC; if(R.closing==null){R.closing=R.opening;} R.diff=R.closing-R.expected }
  return R;
}

     '<tr class="tot"><td>Total in</td><td style="text-align:right">'+fmt(F.inT)+'</td></tr></tbody></table></div>';
  // 3. where it went
  h+='<div class="sec">Where the money went</div><div class="tblw" style="max-height:none"><table class="cmp"><thead><tr><th>Head</th><th>Spent</th><th>Back</th><th>Net</th><th>%</th></tr></thead><tbody>';
  var hs=S.heads.filter(function(x){return F.gross[x.id]||F.back[x.id]}).sort(function(a,b){return (F.gross[b.id]||0)-(F.gross[a.id]||0)});

  if(F.untagOut) h+='<tr data-go="review" style="cursor:pointer"><td><span class="dot" style="background:#bbb"></span>Not tagged yet</td><td>'+fmt(F.untagOut)+'</td><td>–</td><td>'+fmt(F.untagOut)+'</td><td class="muted">'+(F.outT>0?Math.round(F.untagOut/F.outT*100)+'%':'')+'</td></tr>';
  if(F.repay) h+='<tr><td class="muted">🤝 Borrowed loan repaid (not an expense)</td><td class="muted">'+fmt(F.repay)+'</td><td></td><td></td><td></td></tr>';

  // 4. bank account check
  var accs={}; S.entries.forEach(function(e){if(/^acc/.test(e.s)&&e.k) accs[e.s]=1}); Object.keys(S.balances||{}).forEach(function(s){accs[s]=1});
  Object.keys(accs).forEach(function(src){ if(isMulti()&&!isContig()){ h+='<div class="sec">Bank account check · '+esc(srcName(src))+'</div><div class="card small muted">Pick months that follow each other to check the bank balance.</div>'; return } var R=bankCheckP(ms,src);

    var ok=Math.abs(R.diff)<1;
    h+='<div class="tblw" style="max-height:none"><table class="cmp"><tbody>'+
      row('Opening balance (end of '+mLabel(addMonth(ms[0],-1))+')',R.opening)+row('+ Money in',R.in)+row('− Paid from account',R.outExp)+row('− Paid to credit cards',R.outCC)+

    Object.keys(cards).forEach(function(src){ var sp=0,rf=0,pd=0;

      h+='<tr><td>'+esc(srcName(src).replace(' Credit Card',''))+'</td><td>'+(sp?fmt(sp):'–')+'</td><td>'+(rf?fmt(rf):'–')+'</td><td>'+(pd?fmt(pd):'–')+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  // 6. still to receive / pay back (office, loans …)
  var first=S.entries.reduce(function(a,e){return !a||e.d<a?e.d:a},''), endM=m+'-'+pad(daysIn(m)), G={},K={};
  S.entries.forEach(function(e){ if(e.d>endM||e.h==='ccpay') return; partsOf(e).forEach(function(p){ if(!head(p.h)) return; if(isIn(e)) K[p.h]=(K[p.h]||0)+p.v; else G[p.h]=(G[p.h]||0)+p.v }) });
  var track=S.heads.filter(function(x){return x.id==='office'||x.id==='loan'});
  var owe={}; S.entries.forEach(function(e){ if(e.d>endM) return; partsOf(e).forEach(function(p){ if(p.h!=='borrow'&&p.h!=='repay') return; var k=mkey(e.t)||e.t, o=owe[k]||(owe[k]={name:e.t,got:0,paid:0}); if(p.h==='borrow') o.got+=p.v; else o.paid+=p.v }) });

    oweK.forEach(function(k){var o=owe[k],d=o.got-o.paid;

    h+='</tbody></table></div><p class="small muted" style="margin:-4px 4px 12px">When you pay it back, tag that payment as <b>🤝 Repay borrowed loan</b>. Borrowing and repaying are not counted as income or spending.</p>';
  }
  if(track.length){
    h+='<div class="sec">Still to receive / pay back</div><div class="tblw" style="max-height:none"><table class="cmp"><thead><tr><th>Head</th><th>Paid out</th><th>Got back</th><th>Pending</th></tr></thead><tbody>';
    track.forEach(function(x){var g=G[x.id]||0,k=K[x.id]||0,d=g-k;
      h+='<tr data-head="'+x.id+'" style="cursor:pointer"><td>'+esc(x.n)+'</td><td>'+(g?fmt(g):'–')+'</td><td>'+(k?fmt(k):'–')+'</td><td class="'+(d>0.5?'over':d<-0.5?'under':'')+'">'+(Math.abs(d)<0.5?'Settled':d>0?'To receive '+fmt(d):'To pay back '+fmt(-d))+'</td></tr>'});
    h+='</tbody></table></div><p class="small muted" style="margin:-4px 4px 12px">Totals since '+(first?dLabel(first).replace(/^\w+, /,''):'the first entry')+' up to the end of '+mLabel(m)+'.</p>';
  }
  h+='<p class="small muted" style="text-align:center">Tap a row to see its entries. Use ‹ › at the top to change month.</p>';
  el.innerHTML=h;
}

/* ---------- SPLIT (cash withdrawals or any entry -> several heads) ---------- */
function isCash(e){return /withdrawal|\batm\b|cash/i.test((e.t||'')+' '+(e.x||''))&&!/deposit/i.test(e.t||'')}
function partsSum(e){var s=0;(e.parts||[]).forEach(function(p){s+=p.a});return Math.round(s*100)/100}
function partsLeft(e){return Math.round((e.a-partsSum(e))*100)/100}
function partsText(e){return (e.parts||[]).map(function(p){var hh=head(p.h);return headName(p.h)+(p.u&&subName(hh,p.u)?' · '+subName(hh,p.u):'')+' '+fmt(p.a)}).join(' + ')}
function openSplit(e){
  var rows=(e.parts&&e.parts.length)?JSON.parse(JSON.stringify(e.parts)):[{a:'',h:'',u:'',r:''},{a:'',h:'',u:'',r:''}];
  if(isIn(e)&&!(e.parts&&e.parts.length)){ var sal=+S.settings.salary||0, sg0=suggest(e);
    if(sg0&&sg0.h==='salary'&&sal>0&&e.a>sal) rows=[{a:sal,h:'salary',u:'',r:''},{a:Math.round((e.a-sal)*100)/100,h:'office',u:'',r:''}];
    else rows=[{a:e.a,h:sg0?sg0.h:'',u:'',r:''},{a:'',h:'',u:'',r:''}]; }
  var opts=function(sel){ var o='<option value="">— Head —</option>';
    if(isIn(e)) o+=IN_TAGS.slice(0,3).map(function(q){return '<option value="'+q[0]+'"'+(sel===q[0]?' selected':'')+'>'+q[1]+'</option>'}).join('')+'<optgroup label="Money back for">';
    o+=S.heads.map(function(x){return '<option value="'+x.id+'"'+(sel===x.id?' selected':'')+'>'+esc(x.n)+'</option>'}).join('');
    if(isIn(e)) o+='</optgroup>'+IN_TAGS.slice(3).map(function(q){return '<option value="'+q[0]+'"'+(sel===q[0]?' selected':'')+'>'+q[1]+' (not counted)</option>'}).join('');
    return o; };
  function rowHTML(p,i){var hh=head(p.h);
    return '<div class="card" style="padding:10px 12px" data-row="'+i+'"><div class="row2" style="grid-template-columns:110px 1fr"><input class="inp" type="number" inputmode="decimal" step="0.01" placeholder="Amount" data-pa="'+i+'" value="'+(p.a||'')+'">'+
      '<select class="inp" data-ph="'+i+'">'+opts(p.h)+'</select></div>'+
      '<div class="row2" style="grid-template-columns:1fr 1fr;margin-top:6px"><select class="inp" data-pu="'+i+'"'+(hh&&hh.subs?'':' style="visibility:hidden"')+'>'+subOptions(p.h,p.u)+'</select>'+
      '<input class="inp" placeholder="'+(isIn(e)?'Note':'Note (e.g. fish)')+'" data-pr="'+i+'" value="'+esc(p.r||'')+'"></div>'+
      '<button class="btn sm sec2" style="margin-top:6px" data-prm="'+i+'">Remove</button></div>';}
  function draw(){
    var h=title((isIn(e)?'Split money received ':isCash(e)?'Split cash ':'Split ')+esc(e.c)+' '+fmt(e.a,2))+
      '<div class="small muted" style="margin-bottom:8px">'+esc(e.t)+' · '+dLabel(e.d)+'<br>'+(isIn(e)?'Add one line for each part, e.g. salary and office money. Money back for a head reduces that head.':'Add one line for each use of this money. Cash not spent yet? Leave it – it stays in <b>To tag</b> and you can add the rest later.')+'</div>'+
      rows.map(rowHTML).join('')+
      '<button class="btn sec2 full" id="pAdd">+ Add another head</button>'+
      '<div class="card" style="margin-top:10px"><div class="sum"><span>Total</span><b>'+fmt(e.a,2)+'</b></div><div class="sum"><span>Allocated</span><b id="pUsed"></b></div><div class="sum"><span>Left to allocate</span><b id="pLeft"></b></div></div>'+
      '<button class="btn full" id="pSave">Save split</button>'+((e.parts&&e.parts.length)?'<button class="btn danger full" style="margin-top:8px" id="pClear">Remove split</button>':'');
    openSheet(h); totals();
    $$('[data-pa],[data-pr]').forEach(function(i){i.oninput=function(){read();totals()}});
    $$('[data-pu]').forEach(function(i){i.onchange=read});
    $$('[data-ph]').forEach(function(i){i.onchange=function(){read();var k=+i.dataset.ph,hh=head(rows[k].h);rows[k].u=hh&&hh.subs?guessSub({t:rows[k].r||e.t,x:''},hh):'';draw()}});
    $$('[data-prm]').forEach(function(b){b.onclick=function(){read();rows.splice(+b.dataset.prm,1);if(!rows.length)rows.push({a:'',h:'',u:'',r:''});draw()}});
    $('#pAdd').onclick=function(){read();var left=Math.round((e.a-sum())*100)/100;rows.push({a:left>0?left:'',h:'',u:'',r:''});draw()};
    $('#pSave').onclick=function(){
      read(); var ok=rows.filter(function(p){return p.a>0&&p.h});
      if(rows.some(function(p){return p.a>0&&!p.h})){toast('Choose a head for each amount');return}
      if(sum()>e.a+0.005){toast('More than '+fmt(e.a,2)+' – please check');return}
      if(!ok.length){toast('Add at least one amount');return}
      e.parts=ok.map(function(p){return {a:Math.round(p.a*100)/100,h:p.h,u:p.u||'',r:p.r||''}});
      var left=partsLeft(e); e.h=left>0.005?'':'split'; e.u=''; e.how='user'; e.up=now();
      save(); closeSheet(); toast(left>0.005?'Saved · '+fmt(left,2)+' still to allocate':'Split saved'); render();
    };
    if($('#pClear')) $('#pClear').onclick=function(){delete e.parts;e.h='';e.up=now();save();closeSheet();toast('Split removed');render()};
  }
  function read(){rows.forEach(function(p,i){var a=$('[data-pa="'+i+'"]');if(!a)return;p.a=parseFloat(a.value)||0;p.h=$('[data-ph="'+i+'"]').value;p.u=$('[data-pu="'+i+'"]').value||'';p.r=$('[data-pr="'+i+'"]').value})}
  function sum(){var s=0;rows.forEach(function(p){s+=+p.a||0});return Math.round(s*100)/100}
  function totals(){var s=sum(),l=Math.round((e.a-s)*100)/100;$('#pUsed').textContent=fmt(s,2);var L=$('#pLeft');L.textContent=fmt(l,2);L.style.color=l<-0.005?'var(--bad)':l>0.005?'var(--warn)':'var(--ok)'}
  draw();
}

/* ---------- ENTRIES ---------- */
function shopKey(e){return mkey(e.t)||String(e.t||'').toLowerCase()}
function entMatch(e){
  if(entFilter.h==='_in'){ if(!isIn(e)) return false; if(entFilter.inTag&&!(e.h===entFilter.inTag||(e.parts||[]).some(function(p){return p.h===entFilter.inTag}))) return false } else if(entFilter.h){ if(entFilter.h==='_none'){ if(e.h) return false } else if(e.h!==entFilter.h&&!(e.parts||[]).some(function(p){return p.h===entFilter.h})) return false }
  if(entFilter.u){ var okU=(e.h===entFilter.h&&e.u===entFilter.u)||(e.parts||[]).some(function(p){return p.h===entFilter.h&&p.u===entFilter.u}); if(!okU) return false }
  if(entFilter.daily){ var dh=function(id){var x=head(id);return x&&x.daily}; if(!(dh(e.h)||(e.parts||[]).some(function(p){return dh(p.h)}))) return false }
  if(entFilter.shop&&shopKey(e)!==entFilter.shop) return false;
  if(entFilter.q){var q=entFilter.q.toLowerCase(); if((e.t+' '+e.x+' '+e.r).toLowerCase().indexOf(q)<0) return false}
  return true;
}
function entValue(e){ // AED this entry adds to the shown total (only the matching part of a split; money back counts as minus)
  var r26=S.settings.inr||26, cv=function(a){return e.c==='INR'?a/r26:a};
  if(entFilter.h==='_in') return (isIn(e)&&e.h!=='ccpay'&&e.h!=='refund'&&e.h!=='own')?aed(e):0;
  if(e.h==='ignore'||e.h==='ccpay'||e.h==='repay'||isInTag(e.h)) return 0;
  if(isIn(e)){ var s=0; if(e.parts&&e.parts.length) e.parts.forEach(function(p){ if(head(p.h)&&(!entFilter.h||p.h===entFilter.h)) s+=cv(p.a) }); else if(head(e.h)) s=aed(e); return -s }
  if(e.parts&&e.parts.length&&(entFilter.h||entFilter.daily)){ var v=0; e.parts.forEach(function(p){var hp=head(p.h); if((entFilter.h&&p.h===entFilter.h&&(!entFilter.u||p.u===entFilter.u))||(entFilter.daily&&hp&&hp.daily)) v+=cv(p.a)}); if(entFilter.h==='_none') v+=cv(partsLeft(e)); return v }
  return aed(e);
}
function renderEntries(){

  var list=periodEntries().filter(entMatch).sort(function(a,b){return b.d<a.d?-1:b.d>a.d?1:0});

    S.heads.map(function(x){return '<option value="'+x.id+'"'+(entFilter.h===x.id?' selected':'')+'>'+esc(x.n)+'</option>'}).join('')+
    '<option value="_in"'+(entFilter.h==='_in'?' selected':'')+'>Money received</option><option value="_none"'+(entFilter.h==='_none'?' selected':'')+'>Not tagged</option><option value="ignore"'+(entFilter.h==='ignore'?' selected':'')+'>Not an expense</option></select></div>';
  var fl=[]; if(entFilter.h) fl.push(entFilter.h==='_in'?'Money received'+(entFilter.inTag?' · '+(head(entFilter.inTag)?'Back for '+head(entFilter.inTag).n:headName(entFilter.inTag)):''):headName(entFilter.h==='_none'?'':entFilter.h)); if(entFilter.u) fl.push(subName(head(entFilter.h),entFilter.u)); if(entFilter.daily) fl.push('Day-to-day heads');
  if(entFilter.shop){ var sn=list[0]?list[0].t:entFilter.shop; fl.push('🏪 '+sn) }
  if(fl.length) h+='<div class="fbar">Showing: '+esc(fl.join(' · '))+'<button id="fclr">✕ Show all</button></div>';

  if(!list.length) h+='<div class="empty"><b>No entries</b>Nothing for this month and filter.</div>';
  var lastD='';
  list.forEach(function(e){

    h+='<div class="ent" data-edit="'+e.id+'" style="'+(e.h==='ignore'||e.h==='ccpay'||e.h==='refund'||e.h==='own'?'opacity:.6;':'')+(isIn(e)?'border-left:4px solid var(--ok);border-radius:0 14px 14px 0':'')+'"><div class="top"><div><div class="d">'+esc(e.t)+'</div><div class="m">'+esc(srcName(e.s))+(e.how==='auto'?' · auto-tagged':'')+(e.r?' · '+esc(e.r):'')+'</div></div><div class="a"'+(isIn(e)?' style="color:var(--ok)"':'')+'>'+(isIn(e)?'+ ':'')+amtHTML(e)+'</div></div><div style="margin-top:6px">'+tg+'</div></div>';
  });
  el.innerHTML=h; wireEntries();
}
function shopsHTML(list,tot){
  // group this month's matching entries by shop, compare with the same shops last month
  function group(ents){ var G={}; ents.forEach(function(e){ var v=entValue(e); if(Math.abs(v)<0.005) return; var k=shopKey(e), g=G[k]||(G[k]={k:k,v:0,n:0,names:{}}); g.v+=v; if(v>0) g.n++; g.names[e.t]=(g.names[e.t]||0)+1 }); return G }
  var G=group(list), P=group(periodEntries(prevSel()).filter(entMatch));
  var rows=Object.keys(G).map(function(k){var g=G[k],best='',bn=0;for(var nm in g.names) if(g.names[nm]>bn){bn=g.names[nm];best=nm} g.name=best;g.prev=P[k]?P[k].v:0;return g}).sort(function(a,b){return b.v-a.v});
  var max=rows.length?Math.max.apply(null,rows.map(function(r){return r.v})):0;

      '<div class="bar"><i style="width:'+w+'%;background:var(--brand2)"></i></div>'+
      '<div class="s"><span>'+r.n+' visit'+(r.n===1?'':'s')+' · '+pct+'% · avg '+fmt(r.n?r.v/r.n:0)+'</span><span>'+prevLabel()+' '+fmt(r.prev)+(r.prev&&Math.abs(ch)>=1?' <b style="color:'+(ch>0?'var(--bad)':'var(--ok)')+'">'+(ch>0?'▲':'▼')+fmt(Math.abs(ch))+'</b>':'')+'</span></div></button>';
  });
  return h;

function headOptions(sel,withNone,inn){

  S.entries=S.entries.filter(function(e){return !dead['id:'+e.id]});
  S.entries.forEach(function(e){byId[e.id]=e;if(e.k)byK[e.k]=e});
  inc.entries.forEach(function(e){
    if(dead['id:'+e.id]) return;

    if(!l){ if(e.k&&dead[e.k]) return; S.entries.push(e); byId[e.id]=e; if(e.k)byK[e.k]=e; added++; return }
    var take=(e.up||0)>(l.up||0) || (!l.h&&e.h);
    if(take&&!( l.h && !e.h )){ ['d','t','x','a','c','s','h','u','how','r','split','parts','io','fx','sd'].forEach(function(f){l[f]=e[f]}); l.up=e.up; updated++ }
  });
  S.deleted=Object.keys(dead);
  S.balances=S.balances||{}; Object.keys(inc.balances||{}).forEach(function(s){ var B=S.balances[s]||(S.balances[s]={}); Object.keys(inc.balances[s]).forEach(function(d){ if(B[d]==null) B[d]=inc.balances[s][d] }) });

}
/* ---------- LIVE SYNC (encrypted file in a private GitHub repository) ---------- */
var KPSync=(function(){
  var CFG_KEY='kharchapani.sync', FILE='kharchapani-data.json';
  var cfg={}; try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch(e){}
  var busy=false, again=false, dirty=!!cfg.dirty, timer=null, state='idle', errMsg='', keyCache={};
  function saveCfg(){ cfg.dirty=dirty; try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg))}catch(e){} }
  function on(){ return !!(cfg.on&&cfg.owner&&cfg.repo&&cfg.token&&cfg.pass) }
  function label(){
    if(state==='busy') return 'Syncing…';
    if(state==='error') return '⚠ Sync problem – tap';
    if(state==='offline') return 'Offline – will sync later';
    if(!cfg.last) return 'Live sync on';
    var d=new Date(cfg.last); return 'Synced '+pad(d.getHours())+':'+pad(d.getMinutes())+' ✓';
  }
  function setState(s,m){ state=s; errMsg=m||''; showStatus(); var st=document.getElementById('syncState'); if(st) st.textContent=statusText(); }
  function statusText(){ if(!on()) return 'Live sync is off.'; if(state==='error') return '⚠ '+errMsg; return label()+(cfg.last?' · last sync '+new Date(cfg.last).toLocaleString():''); }
  // --- encoding + encryption ---
  function b64(u8){ var s='',i,CH=0x8000; for(i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s) }

  async function keyFor(salt){
    var id=cfg.pass+'|'+b64(salt); if(keyCache[id]) return keyCache[id];
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(cfg.pass),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    keyCache={}; keyCache[id]=k; return k;
  }
  async function seal(obj){
    var salt=cfg.salt?unb64(cfg.salt):crypto.getRandomValues(new Uint8Array(16)); cfg.salt=b64(salt);
    var iv=crypto.getRandomValues(new Uint8Array(12)), k=await keyFor(salt);
    var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj))));
    return JSON.stringify({app:'kharchapani-sync',v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)});
  }
  async function open(text){
    var o=JSON.parse(text); if(o.app!=='kharchapani-sync') throw new Error('The online file is not a Kharcha Pani sync file.');
    var salt=unb64(o.salt); cfg.salt=o.salt;
    try{ var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await keyFor(salt),unb64(o.data)); }
    catch(e){ var er=new Error('The family password does not match the online data.'); er.pass=1; throw er }
    return JSON.parse(new TextDecoder().decode(pt));
  }
  // --- canonical form, to know whether the online copy is already the same ---
  function stable(v){ if(Array.isArray(v)) return '['+v.map(stable).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).filter(function(k){return v[k]!==undefined}).sort().map(function(k){return JSON.stringify(k)+':'+stable(v[k])}).join(',')+'}'; return JSON.stringify(v===undefined?null:v) }
  function canon(st){ return stable({e:st.entries.slice().sort(function(a,b){return a.id<b.id?-1:1}),d:(st.deleted||[]).slice().sort(),h:st.heads,b:st.budgets,db:st.defBudget,s:st.settings,src:st.sources||{},c:st.cfgUp||0,bal:st.balances||{},hv:st.hv}) }
  function shared(){ var c=JSON.parse(JSON.stringify(S)); delete c.lastBackup; return c }
  // --- GitHub ---
  function api(path,opt){ opt=opt||{}; opt.headers=Object.assign({'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.headers||{}); opt.cache='no-store';
    return fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+path,opt) }
  async function getRemote(){
    var h={}; if(cfg.etag&&cfg.sha&&!cfg.force) h['If-None-Match']=cfg.etag;
    var r=await api('/contents/'+FILE,{headers:h});
    if(r.status===304) return {same:true};
    if(r.status===404){ var rr=await api(''); if(rr.status===404) throw new Error('Repository "'+cfg.repo+'" not found, or the access key cannot see it.'); if(rr.status===401) throw new Error('The access key was not accepted.'); return {none:true} }

  }

    if(sha) body.sha=sha;
    var r=await api('/contents/'+FILE,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422){ var e=new Error('conflict'); e.conflict=1; throw e }
    if(r.status===401||r.status===403) throw new Error('The access key cannot write to "'+cfg.repo+'". It needs Contents: Read and write.');
    if(!r.ok) throw new Error('GitHub answered '+r.status+' while saving.');
    var j=await r.json(); cfg.sha=j.content&&j.content.sha; cfg.etag=null;
  }
  async function run(){
    if(!on()) return;
    if(busy){ again=true; return }
    if(navigator.onLine===false){ setState('offline'); return }
    busy=true; setState('busy');
    try{
      for(var attempt=0;attempt<4;attempt++){
        var wasDirty=dirty; dirty=false; saveCfg();
        var rem=await getRemote(), got=null;
        if(rem.same){ if(!wasDirty) break; try{ await putRemote(cfg.sha); break }catch(e){ if(e.conflict){cfg.force=1;dirty=true;continue} dirty=true; throw e } }
        if(!rem.none){
          var o=await open(rem.text); cfg.force=0;
          SYNC_QUIET=true; try{ got=mergeIn(o); migrate(); }finally{ SYNC_QUIET=false }
          cfg.sha=rem.sha; cfg.etag=rem.etag;
          if(got.added||got.updated) render();
          if(canon(shared())===canon(o.state)) break;
        }
        try{ await putRemote(rem.none?null:cfg.sha); break }catch(e){ if(e.conflict){cfg.force=1;dirty=true;continue} dirty=true; throw e }
      }
      cfg.last=Date.now(); saveCfg(); setState('ok');
    }catch(e){
      if(e&&e.name==='TypeError'&&/fetch|network/i.test(e.message)) setState('offline'); else setState('error',e.message||String(e));
      saveCfg();
    }finally{ busy=false; if(again){ again=false; setTimeout(run,500) } }
  }
  function changed(){ if(!on()) return; dirty=true; saveCfg(); clearTimeout(timer); timer=setTimeout(run,2500) }
  setInterval(function(){ if(on()&&document.visibilityState==='visible') run() },30000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') run() });
  window.addEventListener('online',function(){ run() });
  function config(c){ var same=c.owner===cfg.owner&&c.repo===cfg.repo&&c.pass===cfg.pass;
    cfg=Object.assign({},same?cfg:{},c); if(!same){ delete cfg.sha; delete cfg.etag; delete cfg.salt; delete cfg.last; keyCache={} } dirty=true; saveCfg(); return run() }
  function off(){ cfg.on=false; saveCfg(); setState('idle'); }
  return {on:on,label:label,changed:changed,run:run,config:config,off:off,get cfg(){return cfg},statusText:statusText,_open:open,_seal:seal};
})();
setTimeout(function(){ showStatus(); KPSync.run() },800);

function openSync(){
  var c=KPSync.cfg;
  var h=title('Live sync')+'<div class="small muted">Keeps this phone and your family\'s phones the same automatically. Your data is locked with the family password before it goes to your private GitHub repository – nobody can read it without that password.</div>'+
    '<div class="card small" id="syncState" style="margin-top:10px">'+esc(KPSync.statusText())+'</div>'+
    '<label class="f">GitHub username</label><input class="inp" id="syO" value="'+esc(c.owner||'IrbazQazi')+'" autocapitalize="off" autocorrect="off">'+
    '<label class="f">Private data repository</label><input class="inp" id="syR" value="'+esc(c.repo||'kharchapani-data')+'" autocapitalize="off" autocorrect="off">'+
    '<label class="f">Access key (from GitHub)</label><input class="inp" id="syT" type="password" value="'+esc(c.token||'')+'" placeholder="github_pat_…" autocapitalize="off" autocorrect="off">'+
    '<label class="f">Family password (same on every phone)</label><input class="inp" id="syP" type="password" value="'+esc(c.pass||'')+'" autocapitalize="off" autocorrect="off">'+
    '<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="sySh"> Show key and password</label>'+
    '<button class="btn full" style="margin-top:14px" id="syGo">'+(KPSync.on()?'Save and sync now':'Turn on live sync')+'</button>'+
    (KPSync.on()?'<button class="btn sec2 full" style="margin-top:8px" id="syNow">Sync now</button><button class="btn danger full" style="margin-top:8px" id="syOff">Turn off live sync on this phone</button>':'')+
    '<div class="small muted" style="margin-top:12px">Syncs when you make a change, when you open the app, and every 30 seconds while it is open. Without internet it waits and syncs later.</div>';
  openSheet(h);
  $('#sySh').onchange=function(){var ty=this.checked?'text':'password';$('#syT').type=ty;$('#syP').type=ty};
  $('#syGo').onclick=async function(){
    var o=$('#syO').value.trim(),r=$('#syR').value.trim(),tk=$('#syT').value.trim(),pw=$('#syP').value;
    if(!o||!r||!tk||!pw){toast('Please fill in all four boxes');return}
    if(pw.length<6){toast('Use a family password of at least 6 characters');return}
    this.textContent='Connecting…'; await KPSync.config({on:true,owner:o,repo:r,token:tk,pass:pw});
    if(/⚠/.test(KPSync.statusText())){ $('#syncState').textContent=KPSync.statusText(); this.textContent='Try again' } else { closeSheet(); toast('Live sync is on ✓'); render() }
  };
  if($('#syNow')) $('#syNow').onclick=async function(){ this.textContent='Syncing…'; await KPSync.run(); this.textContent='Sync now'; $('#syncState').textContent=KPSync.statusText() };
  if($('#syOff')) $('#syOff').onclick=function(){ if(!confirmInline(this,'Tap again to turn off')) return; KPSync.off(); closeSheet(); toast('Live sync turned off on this phone') };
}

var syncMode='merge';
$('#fileSync').onchange=async function(){
  var f=this.files[0]; if(!f) return;
  try{
    var o=JSON.parse(await f.text()); if(o.app!=='kharchapani') throw new Error('This is not a Kharcha Pani file');
    if(syncMode==='restore'){ S=o.state; migrate(); save(); learn(); toast('Backup restored'); }
    else { var r=mergeIn(o); migrate(); toast(r.added+' new, '+r.updated+' updated entries received'); }
    render();
  }catch(err){toast('Could not open file: '+(err.message||err))}
};
function monthSummary(){
  var c=calcP(), L=['*Kharcha Pani – '+periodLabel()+'*','Budget: '+money(c.tb),'Spent: '+money(c.ts),'Remaining: '+money(c.tb-c.ts)];
  if(c.dl>0) L.push('Days left: '+c.dl+' · Day-to-day per day: '+money(Math.max(0,(c.db-c.ds)/c.dl)));
  L.push('');
  S.heads.forEach(function(x){var p=c.per[x.id]; if(p.budget>0||p.spent>0){var s=status(p.spent,p.budget); L.push((s==='bad'?'🔴':s==='warn'?'🟠':'🟢')+' '+x.n+': '+fmt(p.spent)+(p.budget>0?' / '+fmt(p.budget):''))}});
  if(c.untagN) L.push('⚪ Not tagged: '+fmt(c.untag)+' ('+c.untagN+')');
  return L.join('\n');
}
async function doSummary(){
  var t=monthSummary();
  try{ if(navigator.share){await navigator.share({text:t});return} }catch(e){ if(e&&e.name==='AbortError') return }
  try{ await navigator.clipboard.writeText(t); toast('Summary copied – paste in WhatsApp') }catch(e){ openSheet(title('Summary')+'<textarea class="inp" rows="14">'+esc(t)+'</textarea>') }
}
function doCSV(){
  var rows=[['Date','In/Out','Details','Description','Amount','Currency','Amount AED','Head','Type','Account','Remarks']];
  periodEntries().sort(function(a,b){return a.d<b.d?-1:1}).forEach(function(e){var r=S.settings.inr||26;
    if(e.parts&&e.parts.length){ e.parts.forEach(function(p){var hp=head(p.h);rows.push([e.d,isIn(e)?'In':'Out',e.t,e.x,p.a,e.c,(e.c==='INR'?p.a/r:p.a).toFixed(2),(isIn(e)&&hp?'Back for ':'')+headName(p.h),subName(hp,p.u),srcName(e.s),'Split'+(p.r?': '+p.r:'')])}); var l=partsLeft(e); if(l>0.005) rows.push([e.d,isIn(e)?'In':'Out',e.t,e.x,l,e.c,(e.c==='INR'?l/r:l).toFixed(2),'Not tagged','',srcName(e.s),'Split: not allocated yet']); return }
    var hh=head(e.h);rows.push([e.d,isIn(e)?'In':'Out',e.t,e.x,e.a,e.c,aed(e).toFixed(2),(isIn(e)&&hh?'Back for ':'')+headName(e.h),subName(hh,e.u),srcName(e.s),e.r])});
  var csv='﻿'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n');
  giveFile('KharchaPani_'+(isMulti()?selMonths[0]+'_to_'+curMonth:curMonth)+'.csv',csv,'text/csv');
}

/* ---------- global click handling ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-close],[data-go],[data-act],[data-tag],[data-edit],[data-head],[data-split],[data-daily],[data-bd],[data-allm],[data-shops],[data-pick]'); if(!t) return;
  if(t.hasAttribute('data-close')) closeSheet();
  if(t.dataset.go){ closeSheet(); setView(t.dataset.go); }
  if(t.dataset.head){ entFilter={h:t.dataset.head,q:'',u:t.dataset.sub||'',daily:false}; closeSheet(); setView('entries'); }
  if(t.dataset.shops){ entFilter={h:t.dataset.shops,q:'',u:'',daily:false,view:'shops'}; setView('entries'); return }
  if(t.dataset.pick){ openMonthPicker(); return }
  if(t.dataset.daily){ entFilter={h:'',q:'',u:'',daily:true}; setView('entries'); }
  if(t.dataset.bd){ openBreakdown(t.dataset.bd); }
  if(t.dataset.allm){ entFilter={h:'',q:'',u:'',daily:false}; closeSheet(); setView('entries'); }
  if(t.dataset.edit) openEdit(t.dataset.edit);
  if(t.dataset.split){ var se=S.entries.filter(function(x){return x.id===t.dataset.split})[0]; if(se) openSplit(se); return }
  if(t.dataset.tag){
    var card=t.closest('[data-id]'), id=card.dataset.id, e=S.entries.filter(function(x){return x.id===id})[0];
    var hh=head(t.dataset.tag), sg0=suggest(e), knownSub=sg0&&sg0.h===t.dataset.tag&&sg0.u;
    if(hh&&hh.subs&&!t.dataset.sub&&!knownSub){
      var box=card.querySelector('.subask'); if(box) box.remove();
      box=document.createElement('div'); box.className='subask';
      box.innerHTML='<div class="small muted" style="margin-top:10px">Which '+esc(hh.n)+' type?</div><div class="chips" style="margin-top:6px">'+hh.subs.map(function(s){return '<button class="chip subc on" data-tag="'+hh.id+'" data-sub="'+s[0]+'">'+esc(s[1])+'</button>'}).join('')+'</div>';
      card.appendChild(box); return;
    }
    var more=tagEntry(e,t.dataset.tag,t.dataset.sub||null);
    toast(headName(t.dataset.tag)+(more?' · also tagged '+more+' more from this shop':''));
    card.style.transition='opacity .2s'; card.style.opacity='0';
    setTimeout(function(){render()},200);
  }
  var a=t.dataset.act;
  if(a==='shopsuae'){ entFilter={h:'home',q:'',u:'',daily:false,view:'shops'}; setView('entries'); }
  if(a==='livesync'){ openSync(); }
  if(a==='syncnow'){ if(KPSync.on()) KPSync.run(); else { setView('more') } }
  if(a==='import') openImport();
  else if(a==='add') openEdit(null);
  else if(a==='budgets') openBudgets();
  else if(a==='heads') openHeads();
  else if(a==='settings') openSettings();
  else if(a==='backup') doBackup();
  else if(a==='send') doSend();
  else if(a==='receive'){syncMode='merge';var f=$('#fileSync');f.value='';f.click()}
  else if(a==='restore1'){syncMode='restore';var g1=$('#fileSync');g1.value='';g1.click()}
  else if(a==='restore'){ if(confirmInline(t,'Tap again – this replaces all data')){syncMode='restore';var g=$('#fileSync');g.value='';g.click()} }
  else if(a==='summary') doSummary();
  else if(a==='csv') doCSV();
  else if(a==='reset'){ if(confirmInline(t.querySelector('b')||t,'Tap again to delete everything')){ S=fresh(); save(); learn(); toast('Started fresh'); render() } }
  else if(a==='acceptall'){
    var n=0; S.entries.filter(function(e){return !e.h&&!(e.parts&&e.parts.length)}).forEach(function(e){var sg=suggest(e); if(sg){e.h=sg.h;e.u=sg.u;e.how='user';e.up=now();n++}});
    save(); learn(); toast(n+' entries tagged'); render();
  }
});

function render(){
  $('#mLabel').textContent=periodLabel();
  var need=S.entries.filter(function(e){return !e.h}).length, b=$('#badge'); b.style.display=need?'':'none'; b.textContent=need>99?'99+':need;
  $('#mPrev').parentNode.style.visibility=(curView==='review')?'hidden':'visible';
  if(curView==='home') renderHome(); else if(curView==='review') renderReview(); else if(curView==='entries') renderEntries(); else if(curView==='compare') renderCompare(); else if(curView==='flow') renderFlow(); else renderMore();
}
save(); learn(); render();
